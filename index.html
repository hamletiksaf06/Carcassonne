<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Carcassonne</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2E2219">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Carcassonne">
<link rel="apple-touch-icon" href="img/icon-180.png">
<link rel="icon" href="img/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<!-- TITLE -->
<section class="view on" id="vTitle">
  <img id="bg" src="img/board.png" alt="">
  <div id="gameTitle">Carcassonne</div>
  <div class="tl">
    <button class="pb px ib" id="btnSettings" aria-label="Settings"><img src="img/i_settings.png" alt=""></button>
    <div><button class="pb px badge hide" id="badge" aria-label="Edit your profile"><img id="bImg" src="img/i_boy.png" alt=""><span id="bName"></span></button><br><span class="code hide" id="bCode"></span></div>
  </div>
  <div class="center px">
    <button class="pb px" id="btnNew" disabled>New game</button>
    <button class="pb px" id="btnCont" disabled>Continue game</button>
    <button class="pb px" id="btnRules">Rulebook</button>
    <button class="pb px" id="btnStats">Stats</button>
  </div>
  <div class="chal px" id="chal" aria-label="Challenges"></div>
  <div class="brc"><button class="pb px ib" id="btnMotion" aria-label="Background motion"><img id="motionImg" src="img/i_animations.png" alt=""></button></div>
</section>

<!-- GAME -->
<section class="view" id="vGame">
  <canvas id="cv"></canvas>
  <div class="gtl">
    <button class="pb px ib" id="btnMenu" aria-label="Menu"><img src="img/i_menu.png" alt=""></button>
    <div class="scores px" id="scores"></div>
    <div class="left px"><img src="img/i_tiles_left.png" alt="Tiles left"><span id="tilesLeft"></span></div>
  </div>
  <div class="gbl">
    <button class="pb px ib" id="btnRec" aria-label="Recentre"><img src="img/i_recentre.png" alt=""></button>
    <button class="pb px ib" id="btnZo" aria-label="Zoom out"><img src="img/i_zoom_out.png" alt=""></button>
    <button class="pb px ib" id="btnZi" aria-label="Zoom in"><img src="img/i_zoom_in.png" alt=""></button>
  </div>
  <div class="px" id="panel"></div>
  <div class="px" id="banner"></div>
  <div class="px" id="final"><h2>Final scoring</h2><div class="tot"><div><img id="fIcon0" alt=""><span id="fName0"></span></div><span id="fTot0"></span></div>
    <div class="tot"><div><img id="fIcon1" alt=""><span id="fName1"></span></div><span id="fTot1"></span></div><div id="lines"></div>
    <button class="pb px tb hide" id="btnShowWin">Show result</button></div>
</section>
<div id="float"></div>

<!-- VS -->
<div id="vs">
  <div class="side"><img id="vsIconA" alt=""><div class="nm" id="vsA"></div><div class="num" id="numA"></div></div>
  <div class="vsword">VS</div>
  <div class="side"><img id="vsIconB" alt=""><div class="nm" id="vsB"></div><div class="num" id="numB"></div></div>
  <div id="vsMsg"></div>
</div>

<!-- MODALS -->
<div class="dim" id="mWho"><div class="modal px">
  <h2>Who are you?</h2>
  <div class="pick"><button class="pb px card" data-g="boy"><img src="img/i_boy.png" alt="">Boy</button><button class="pb px card" data-g="girl"><img src="img/i_girl.png" alt="">Girl</button></div>
  <div class="field"><label for="whoName">Your name</label><input class="inp" id="whoName" maxlength="12" autocomplete="off"></div>
  <button class="pb px tb" id="whoOk" disabled>Confirm</button>
</div></div>

<div class="dim" id="mNew"><div class="modal px">
  <h2>New game</h2>
  <div class="field"><label for="gName">Game name</label><input class="inp" id="gName" maxlength="20" autocomplete="off"></div>
  <div class="field"><label>Turn timer</label><div class="opts" id="timers"></div></div>
  <div class="field"><label>Your colour</label><div class="cols" id="myCols"></div></div>
  <div class="field"><label>Opponent</label><div class="opts" id="friends"></div>
    <div class="row" style="width:100%;flex-wrap:nowrap"><input class="inp" id="fCode" maxlength="8" placeholder="Friend code, like HAM-4821" autocomplete="off" autocapitalize="characters"><button class="pb px tb" id="fAdd" style="white-space:nowrap">Add friend</button></div></div>
  <div class="err" id="newErr"></div>
  <div class="row"><button class="pb px tb" id="send" disabled>Send challenge</button><button class="pb px tb" id="cancelNew">Cancel</button></div>
</div></div>

<div class="dim" id="mColor" style="z-index:25"><div class="modal px">
  <h2>Choose your colour</h2>
  <div class="cols" id="pickCols"></div>
  <button class="pb px tb" id="colorOk" disabled>Confirm</button>
</div></div>

<div class="dim" id="mMenu"><div class="modal px">
  <h2 id="menuTitle">Menu</h2>
  <button class="pb px tb" id="menuBack" style="width:100%">Back to start</button>
  <button class="pb px tb" id="menuEnd" style="width:100%">End game</button>
  <button class="pb px tb" id="menuClose" style="width:100%">Close</button>
</div></div>

<div class="dim" id="mConfirm" style="z-index:26"><div class="modal px">
  <h2>End the game?</h2><div class="sub">This counts as a loss for you.</div>
  <div class="row"><button class="pb px tb" id="endYes">End game</button><button class="pb px tb" id="endNo">Keep playing</button></div>
</div></div>

<div class="dim" id="mWin" style="z-index:15"><div class="modal px">
  <div class="wface"><img class="f" id="wFace" alt=""><img class="c" id="wCrown" src="img/i_crown.png" alt=""></div>
  <h2 id="wTitle"></h2><div id="wScore"></div>
  <div class="row"><button class="pb px tb" id="wBoard">View final board</button><button class="pb px tb" id="wBack">Back to start</button></div>
</div></div>

<div class="toast px" id="toast"></div>
<div class="turn">Turn your phone sideways</div>
<script type="module" src="js/app.js"></script>
</body>
</html>
